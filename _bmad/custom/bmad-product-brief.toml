# Override team cho bmad-product-brief — KA6 Strategy Analysis + nhánh
# Discovery (KA4 Elicitation).
#
# Sparse: chỉ field thay đổi.
#
# Đây là bước khai thác. Hình thái bài toán làm thay đổi PHƯƠNG PHÁP khai
# thác mạnh nhất ở chính bước này: doanh nghiệp nội bộ thì hỏi Domain SME có
# thật, sản phẩm ra thị trường thì phải nghiên cứu vì không tồn tại SME nào
# biết câu trả lời, thay hệ cũ thì đọc chính hệ đang chạy.
#
# PHÂN ĐỊNH NGUỒN nằm trong COMMENT, không trong directive — resolver parse
# TOML nên comment không tới agent, còn verify.py đọc văn bản thô nên vẫn đối
# chiếu số hiệu với bản sách. Đặt số hiệu trong directive thì agent chép vào
# tài liệu bàn giao.

