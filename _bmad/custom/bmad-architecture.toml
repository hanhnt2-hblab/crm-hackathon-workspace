  "Khi hình thái là vòng đời bản ghi hoặc nền tảng dữ liệu, tra Data Modelling ở mức hơn danh sách thực thể: cardinality, thuộc tính, và tách ba tầng conceptual/logical/physical khi cần. BMad mặc định chỉ sinh ERD tối giản gồm tên và quan hệ — đó là chủ ý của BMad, phần bù nằm ở chi tiết.",

