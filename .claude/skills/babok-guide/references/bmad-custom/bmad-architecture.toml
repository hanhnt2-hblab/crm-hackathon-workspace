  "Data model có ba tầng (BABOK 10.15.2) và mỗi tầng có người đọc khác nhau: conceptual độc lập công nghệ (phía nghiệp vụ), logical chuẩn hoá (thiết kế giải pháp), physical do implementation subject matter expert làm (hiệu năng, concurrency, bảo mật). Đừng nhảy thẳng vào physical và bỏ mất tầng conceptual.",

