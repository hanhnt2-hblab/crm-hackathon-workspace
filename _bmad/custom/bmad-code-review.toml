| Enum, ngưỡng, con số | Mục 0 của `docs/Đề bài/Phản biện và phân tích yêu cầu.md` (`D1`–`D47`) |
| Điểm nghiệm thu `T-1`…`T-10` | `docs/Đề bài/Yêu Cầu đề bài chính thức của cuộc thi prd.md` |
| Bất biến xuyên tầng, ranh giới nhập, quy ước chung | `_bmad-output/planning-artifacts/architecture/architecture-crm-hackathon-2026-08-14/ARCHITECTURE-SPINE.md` (`AD-1`…`AD-22`) |
| Quyết định của MỘT tầng | spine tầng tương ứng — xem bảng tầng bên dưới |
| Màu, khoảng cách, kiểu chữ, đặc tả component | `_bmad-output/planning-artifacts/ux-designs/ux-crm-hackathon-2026-08-14/DESIGN.md` |
| Hành vi màn hình, trạng thái, luồng, microcopy, sàn tiếp cận | `_bmad-output/planning-artifacts/ux-designs/ux-crm-hackathon-2026-08-14/EXPERIENCE.md` |
| Một danh từ miền nghĩa là gì | `src/ontology/crm.ontology.md` |
| Story đang rà thuộc cục nào, sở hữu tệp nào, tiêu chí gì | `_bmad-output/planning-artifacts/epics/epics-crm-hackathon-2026-08-14/epics.md` |

Đọc ĐÚNG MỤC, không đọc trọn tệp.""",

  """BẢNG TẦNG — mỗi thư mục thuộc đúng một tầng, dưới `_bmad-output/planning-artifacts/architecture/`.

| Thư mục | Tầng | Spine | Tiền tố mã |
|---|---|---|---|
| `src/app/**`, `src/ingest/**`, `src/scan/**` | ① Tương tác | `architecture-tier1-tuong-tac/` | `AD-UI-*` |
| `src/agent/**` | ② Agent Runtime | `architecture-tier2-agent/` | `AD-AG-*` |
| `src/autonomy/**` | ③ Cổng tự chủ | `architecture-tier3-autonomy/` | `AD-GT-*` |
| `src/capability/**` | ④ Capability | `architecture-tier4-capability/` | `AD-CP-*` |
| `src/core/**`, `prisma/**` | ⑤ Lõi domain | `architecture-tier5-core/` | `AD-CR-*` |

Rà mã tầng nào thì mở spine tầng đó, không mở cả năm.""",

  """THỨ TỰ PHÂN XỬ khi hai tài liệu nói khác nhau (`AD-13`):
đề bài §1–§7  >  Mục 0 (`D1`–`D47`)  >  PRD  >  spine kiến trúc  >  UX  >  ontology  >  lược đồ.
Mã lệch khỏi tài liệu hạng TRÊN là lỗi. Hai tài liệu lệch nhau là XUNG ĐỘT TÀI LIỆU — nêu ra như một phát hiện riêng, đừng lặng lẽ chọn bên.""",

  # ── Kỷ luật rà soát ────────────────────────────────────────────────────────
  "Khi một phát hiện đụng tới chi tiết đề bài đã chốt, đối chiếu với `D1`–`D47` ở Mục 0 trước khi kết luận là lỗi. Mã lệch khỏi `Dn` là lỗi; mã lệch khỏi thói quen cá nhân thì không.",

