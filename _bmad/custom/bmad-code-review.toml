# KHÔNG do hub babok-bmad-skill sinh ra — đội tự viết. install.py không đụng tệp này.
#
# Hai việc, cùng lý do với bmad-build.toml:
#   ① ĐỊNH TUYẾN ĐỌC — không có bảng này thì người rà kết luận "lỗi" hay "không
#      lỗi" theo trí nhớ, và trí nhớ về một dự án 10.303 dòng tài liệu là thứ
#      không kiểm được. Bảng dưới cho biết mở tệp nào để phân xử.
#   ② GHI VẾT QUYẾT ĐỊNH — phát hiện bị BÁC kèm lý do rõ là bằng chứng tốt cho
#      vấn đáp vòng 2, hơn hẳn một danh sách phát hiện không ai xử.
#
# ⚠ KHÔNG dùng `file:` ở đây. Đã đo: PRD 1066 dòng · spine cha 1544 · năm spine
# tầng 4030 · UX 1118 · Mục 0 1675 · ontology 347. Rà soát vốn đã ngốn ngữ cảnh
# vì phải giữ diff; nạp thêm cả kho tài liệu là ngộp. Định tuyến, đừng nạp sẵn.
#
# Bề mặt: activation_steps_prepend · activation_steps_append · persistent_facts ·
# on_complete · [[review_layers]] (có thêm trường `when`).
# Đã kiểm: persistent_facts đọc ở SKILL.md:40, on_complete ở
# steps/step-04-present.md:130-132, review_layers ở steps/step-02*.

[workflow]

persistent_facts = [
  # ── ĐỊNH TUYẾN ĐỌC ─────────────────────────────────────────────────────────
