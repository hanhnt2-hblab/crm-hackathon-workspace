# Override cho bmad-architecture — nạp babok-guide và các ràng buộc BABOK cho bước CA.
#
# CÀI: copy cả thư mục này vào {project-root}/_bmad/custom/ sau khi chạy `npx bmad-method install`.
#
# `persistent_facts` là APPEND-MERGE, nên dòng mặc định
# "file:{project-root}/**/project-context.md" vẫn được giữ.
#
# Bù gap đã đo: `entity relationship / ER diagram` = 0 file, `sequence diagram` = 0 file,
# `data model` = 6 file (được nhắc, không có artifact).

[workflow]

persistent_facts = [
  # `file:` la tien to DUY NHAT duoc SKILL.md cua BMad bao dam nap
  # (bmad-prd SKILL.md: "entries prefixed `file:` are loaded").
  # Tien to `skill:` co trong comment cua customize.toml nhung khong co chi dan nap
  # trong SKILL.md, nen khong dung mot minh.
  "file:{project-root}/.claude/skills/babok-guide/references/workflow.md",

