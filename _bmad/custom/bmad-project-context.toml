# Override team cho bmad-project-context — khảo sát hiện trạng theo kỷ luật
# BABOK, và ghi khung phân tích vào khối AGENTS.md.
#
# Sparse: chỉ field thay đổi.
#
# Đây là điểm nhúng RỘNG NHẤT trong toàn bộ phần tuỳ biến: AGENTS.md được mọi
# agent trong repo đọc, không riêng workflow BMad. Nó đi vòng qua vấn đề còn
# sáu workflow chưa có override — bmad-build và bmad-code-review cũng thừa
# hưởng kỷ luật phân loại yêu cầu qua đường này.
#
# Đánh đổi đã biết: khối AGENTS.md nạp háo mọi phiên, kể cả phiên không làm gì
# liên quan phân tích nghiệp vụ. Nên giữ phần ghi vào đó THẬT NGẮN — khung để
# phân loại, không phải hướng dẫn cách làm.
#
# PHÂN ĐỊNH NGUỒN trong comment, không trong directive.

