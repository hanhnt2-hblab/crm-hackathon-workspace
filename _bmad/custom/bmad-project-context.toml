activation_steps_append = [
  "Khi soạn khối bmad:context cho AGENTS.md, thêm một mục ngắn tên 'Khung phân tích' gồm đúng hai thứ, không thêm gì khác. Thứ nhất, năm loại yêu cầu để mọi người phân loại nhất quán: business (vì sao thay đổi), stakeholder (nhu cầu bên liên quan), solution functional (làm gì), solution non-functional (tốt đến mức nào), transition (chỉ cần trong lúc chuyển đổi rồi bỏ). Thứ hai, sáu khái niệm phải xét cùng lúc khi bàn một thay đổi: Need, Change, Solution, Stakeholder, Value, Context — và lưu ý rằng đóng khung Solution trước khi hiểu Need là lỗi phổ biến nhất. Ghi như một quy ước của dự án, KHÔNG ghi như một sự kiện đã kiểm chứng từ repo, vì nó là khung phương pháp chứ không phải điều quan sát được từ mã. Nhắc tên khung một lần làm xuất xứ là đủ, không trích số hiệu mục.",
]
