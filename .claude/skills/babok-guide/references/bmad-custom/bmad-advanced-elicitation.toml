# Tiêm kỹ thuật BABOK v3 vào catalog của bmad-advanced-elicitation.
#
# CÀI: chạy `npx bmad-method install` trước, rồi copy file này thành
#   {project-root}/_bmad/custom/bmad-advanced-elicitation.toml        (cả team)
#   {project-root}/_bmad/custom/bmad-advanced-elicitation.user.toml   (cá nhân)
#
# HAI LOẠI KHUYẾT ĐIỂM, ĐỪNG LẪN:
#   1. Khuyết trong catalog — đã đo: 0/71 method là kỹ thuật khai thác người thật. Toàn bộ
#      71 method là kỹ thuật *cách LLM suy nghĩ*. Nên MỌI method BABOK dưới đây đều bù vào
#      khoảng trống này.
#   2. Khuyết trong toàn bộ src/ — đã đo riêng, ghi ở comment từng nhóm. Nhóm "khuyết hẳn"
#      là nơi đáng đầu tư nhất.
#
# BẢN QUYỀN: mọi `description` là diễn đạt lại, KHÔNG trích nguyên văn BABOK. Số section để
# tra ngược trong bản BABOK của chính bạn.

[workflow]

# Công tắc người-thật. BMad mô phỏng góc nhìn để bù cho việc không có người thật
# (bmad-party-mode tự mô tả là "AI focus-group panel"). Khi có chuyên gia ngồi cùng phòng,
# mô phỏng là lựa chọn kém hơn — hai dòng đầu đảo ngược mặc định đó.
preferences = [
  "When a real domain expert or end user is present and can answer, elicit from them directly instead of running persona simulation or round-table methods - simulation is the fallback for absent stakeholders, not the default.",
  "Route each question to the role that actually holds the answer: scope and cut order to the sponsor, process and rules and terminology to the domain SME, click-and-field reality to the end user, feasibility and estimates to the implementation SME.",
  "Ask a roles-and-permissions question twice - who is allowed to see it is a sponsor decision, who needs to see it is a domain SME fact.",
  "Every non-functional requirement needs a measurable threshold, not an adjective.",
]

# ══════════════════════════════════════════════════════════════════════════════
# NHÓM A — khuyết hẳn trong src/ (0–1 file). Ưu tiên cao nhất.
# ══════════════════════════════════════════════════════════════════════════════

[[workflow.additional_methods]]
code = "babok-process-modelling"
category = "babok"
method_name = "Process Modelling (BABOK 10.35)"
description = "Map the end-to-end business process as steps actors and handoffs - a feature list describes what exists while a process model exposes where work actually stalls"
output_pattern = "actors → steps → handoffs → stall points"

[[workflow.additional_methods]]
code = "babok-state-modelling"
category = "babok"
method_name = "State Modelling (BABOK 10.44)"
description = "Model the lifecycle of a business object as states and permitted transitions - catches pipelines that silently allow a deal to jump from prospect to won"
output_pattern = "states → allowed transitions → guards"

[[workflow.additional_methods]]
code = "babok-business-rules"
category = "babok"
method_name = "Business Rules Analysis (BABOK 10.9)"
description = "Separate the rules that govern decisions - discount authority, approval thresholds, stage guards - from the process steps that merely execute them"
output_pattern = "decisions → governing rules → constraints"

[[workflow.additional_methods]]
code = "babok-roles-permissions"
category = "babok"
method_name = "Roles and Permissions Matrix (BABOK 10.39)"
description = "Cross roles against actions to make visibility and authority explicit - the fastest way to find the record a role can reach but should not"
output_pattern = "roles × actions → matrix → gaps"

[[workflow.additional_methods]]
code = "babok-sequence-diagrams"
category = "babok"
method_name = "Sequence Diagrams (BABOK 10.42)"
description = "Trace a single scenario as an ordered exchange between participants - forces the order and the failure branches into the open before code assumes them"
output_pattern = "participants → ordered messages → failure branches"

# ══════════════════════════════════════════════════════════════════════════════
# NHÓM B — mỏng trong src/ (4–6 file).
# ══════════════════════════════════════════════════════════════════════════════

[[workflow.additional_methods]]
code = "babok-data-modelling"
category = "babok"
method_name = "Data Modelling (BABOK 10.15)"
description = "Define entities attributes and cardinality beyond the minimal spine - BMad's architecture spine deliberately caps its ERD at names and relationships only, so reach for this when the schema needs more"
output_pattern = "entities → relationships → cardinality → constraints"

[[workflow.additional_methods]]
code = "babok-concept-modelling"
category = "babok"
method_name = "Concept Modelling (BABOK 10.11)"
description = "Pin down the key terms and how they relate before they reach the schema - in CRM the Lead / Contact / Account / Opportunity boundary is where ambiguity turns into rework"
output_pattern = "terms → definitions → relationships"

[[workflow.additional_methods]]
code = "babok-nfr-analysis"
category = "babok"
method_name = "Non-Functional Requirements Analysis (BABOK 10.30)"
description = "Surface the quality attributes a solution must hold - performance security auditability availability - each with a measurable threshold rather than an adjective"
output_pattern = "quality attribute → measurable target → verification"

[[workflow.additional_methods]]
code = "babok-interface-analysis"
category = "babok"
method_name = "Interface Analysis (BABOK 10.24)"
description = "For each connection between components specify name coverage exchange method message format and frequency - broad by design so it finds missing integrations without over-analysing detail"
output_pattern = "who/what/when/where/why/how → interface spec"

# ══════════════════════════════════════════════════════════════════════════════
# NHÓM C — công tắc người-thật. Đây là những method mà catalog TUYỆT ĐỐI không có:
# khai thác từ con người thật thay vì mô phỏng persona.
# ══════════════════════════════════════════════════════════════════════════════

[[workflow.additional_methods]]
code = "babok-interviews"
category = "babok"
method_name = "Interviews with real stakeholders (BABOK 10.25)"
description = "Question an actual person one-on-one and document the answers - the technique persona rotation approximates; prefer this whenever the real expert is reachable"
output_pattern = "goal → questions → answers → confirmed notes"

[[workflow.additional_methods]]
code = "babok-workshops"
category = "babok"
method_name = "Facilitated Workshop with real stakeholders (BABOK 10.50)"
description = "Bring the actual decision-makers into one facilitated session to converge - replaces party-mode and round-table simulation when the humans are in the room"
output_pattern = "agenda → facilitated convergence → decisions with owners"

[[workflow.additional_methods]]
code = "babok-document-analysis"
category = "babok"
method_name = "Document Analysis (BABOK 10.18)"
description = "Mine existing artifacts - competitor docs contracts policies legacy screens - for requirements before inventing any, and use the findings to cross-check whatever other techniques produced"
output_pattern = "artifacts → extracted rules → gaps vs current state"

# ══════════════════════════════════════════════════════════════════════════════
# ĐÃ CỐ Ý KHÔNG TIÊM
#
#   Prioritization (10.33)                — BMad phủ 14 file
#   Acceptance and Evaluation Criteria    — BMad phủ 30 file, mạnh nhất
#   Brainstorming (10.5)                  — đã có bmad-brainstorming
#   Stakeholder Personas (10.43)          — đã có, và là mô phỏng, xem NHÓM C
#   Lessons Learned (10.27)               — đã có bmad-retrospective
#   Scope Modelling (10.41)               — CHƯA ĐO độ phủ, không kết luận
#
# Nguyên tắc: BMad mạnh chỗ nào thì không can thiệp. Thêm method trùng chỉ làm loãng menu.
# ══════════════════════════════════════════════════════════════════════════════
