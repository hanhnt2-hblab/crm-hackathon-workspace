# Override cho bmad-spec — nạp babok-guide và các ràng buộc BABOK cho bước SPC.
#
# CÀI: copy cả thư mục này vào {project-root}/_bmad/custom/ sau khi chạy `npx bmad-method install`.
#
# `persistent_facts` là APPEND-MERGE, nên các dòng mặc định vẫn được giữ.
#
# Bù gap đã đo — đây là bước BMad khuyết nặng nhất: `business rule` = 1 file (chỉ trong một bước
# validate prerequisite), `state model` = 1 file (chỉ trong v6-shims), `roles matrix` = 0 file.

[workflow]

persistent_facts = [
  "file:{project-root}/.claude/skills/babok-guide/references/steps/spec.md",

  "Skill `babok-guide` chứa catalog 50 kỹ thuật BABOK kèm số section và số trang, cùng bản đồ khuyết điểm của BMad đã đo trên bản cài. Gọi nó khi cần tra sâu một kỹ thuật cụ thể.",

  "PHÂN LOẠI LUẬT TRƯỚC KHI GẮN MỨC THỰC THI. BABOK 10.9.3 chia business rule làm hai loại và chúng KHÔNG dùng chung cơ chế: (a) Definitional rule (10.9.3.1) shape khái niệm — 'cannot be violated but they can be misapplied'. Loại này KHÔNG có mức thực thi; nó là định nghĩa hoặc phép tính, cài như một hàm dẫn xuất, không phải như một chốt chặn. Ví dụ CRM: 'khách được coi là Ưu tiên nếu đặt hơn 10 đơn/tháng'. (b) Behavioural rule (10.9.3.2) ràng buộc hành vi người — luôn có thể bị vi phạm.",

  "CHỈ behavioural rule mới gắn mức thực thi. BABOK 10.9.3.2 liệt kê bốn mức: allow no violations (strictly enforced) / override by authorized actor / override with explanation / no active enforcement. Mức được chọn quyết định luật sống ở đâu — DB constraint, service layer kèm kiểm quyền và audit log, hay chỉ cảnh báo UI. Chọn nhầm mức thì phải sửa schema về sau. Bắt một definitional rule phải chọn mức là lỗi phân loại, không phải lỗi thiết kế.",

  "State model (BABOK 10.44.3.2) phải liệt kê các transition ĐƯỢC PHÉP kèm điều kiện canh, không chỉ liệt kê danh sách trạng thái. Mỗi transition mô tả bằng ba phần: event gây ra nó, condition quyết định có đáp lại event hay không, và action đi kèm. Thiếu phần này thì pipeline cho phép deal nhảy stage vô lý.",

  "ĐỪNG GIẢ ĐỊNH VÒNG ĐỜI TUYẾN TÍNH. BABOK 10.44.3.2 nói rõ chuỗi trạng thái 'are not always linear' — thực thể có thể nhảy vượt nhiều trạng thái hoặc quay lui về trạng thái trước, và quay lui nhiều lần. Với CRM, phải hỏi thẳng Domain SME: deal có bao giờ tụt ngược stage không, và deal đã đóng có mở lại được không. Cài chặn tuyến tính rồi mới phát hiện nghiệp vụ cho quay lui là phải sửa cả ma trận transition lẫn dữ liệu đã có.",

  "Roles matrix (BABOK 10.39) cần hỏi hai người, hai câu khác nhau: 'ai ĐƯỢC thấy gì' là quyết định của sponsor (2.4.9 — sponsor kiểm soát phạm vi), 'ai CẦN thấy gì' là dữ kiện của domain SME. Hỏi một người thì thiếu một nửa.",

  "Đừng bỏ sót Delegation và Inheritance (BABOK 10.39.3.4): uỷ quyền tạm thời khi người có thẩm quyền vắng mặt, và việc cấp trên thấy dữ liệu của cấp dưới tới mấy tầng. Cả hai là YÊU CẦU DỮ LIỆU, không phải UI — phát hiện muộn thì phải migrate schema.",

  "Chức danh không phải role. BABOK 10.39.3.1: cùng job title có thể khác role, khác job title có thể cùng role. Đừng lấy sơ đồ tổ chức làm ma trận quyền.",

  "Business rule phải practicable — BABOK 10.9.2 định nghĩa là 'needing no further interpretation for use by people in the business'. Phép thử rẻ nhất: đọc xong luật mà vẫn phải hỏi lại thì nó chưa phải business rule.",
]
