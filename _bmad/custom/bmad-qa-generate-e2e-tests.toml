    --text "<sinh test cho cái gì · lớp tương đương và biên nào đã phủ · ca nào cố ý bỏ và vì sao · vòng self-healing nào đã chạy và sửa gì>"

Một dòng, nêu quyết định và lý do — không chép lại nội dung test. Dòng này là thứ
dùng để trả lời khi vòng 2 bốc trúng câu hỏi về phần kiểm thử.
