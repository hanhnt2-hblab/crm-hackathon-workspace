  "Khi dự án có nhiều nguồn tài liệu gọi cùng một thứ bằng những tên khác nhau, tra Glossary và dựng bảng ánh xạ: tên đội dùng, tên trong mã, tên tài liệu nguồn dùng. Nêu riêng những cặp từ dễ gộp nhầm kèm cái giá nếu gộp.",
]

