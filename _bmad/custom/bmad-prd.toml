#
# CÀI: copy cả thư mục này vào {project-root}/_bmad/custom/ sau khi chạy `npx bmad-method install`.
#
# `persistent_facts` là APPEND-MERGE theo quy tắc BMad, nên dòng mặc định
# "file:{project-root}/**/project-context.md" vẫn được giữ — không mất gì.
#
# Bù gap đã đo: `process model` = 0 file trong src/ của BMad, `glossary` và `non-functional` = 6 file.

