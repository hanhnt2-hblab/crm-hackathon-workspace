  "Khi sản phẩm có một tệp từ vựng dùng chung — ontology, domain model, glossary — tra Concept Modelling. Định nghĩa khái niệm bằng một câu, đặt tên quan hệ thành câu đọc được, và giữ phần này ĐỘC LẬP với thuộc tính và lược đồ lưu trữ. Trộn từ vựng với mô hình dữ liệu làm từ vựng trôi theo lược đồ.",

  # BABOK `10.23`: định nghĩa các thuật ngữ then chốt của miền.
  # thực hành: bảng nhiều cột là bổ sung của repo này — một khái niệm thường
