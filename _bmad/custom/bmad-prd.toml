# Override team cho bmad-prd — nhúng kỷ luật BABOK vào việc làm PRD.
#
# Sparse: chỉ field thay đổi.
#
# Luật háo/lười: persistent_facts giữ suốt phiên nên chỉ để khung mỏng và một
# con trỏ skill. Tri thức nặng nằm ở external_sources, chỉ tra khi khớp điều kiện.
#
# Mỗi entry external_sources mô tả MỘT THỜI ĐIỂM và MỘT kỹ thuật. Gộp hai kỹ
# thuật dưới một điều kiện thì chỉ nhánh khớp điều kiện bắn — đã đo được.
#
# PHÂN ĐỊNH NGUỒN nằm trong COMMENT, không nằm trong directive. Lý do: resolver
# parse TOML nên comment không tới agent, còn verify.py đọc văn bản thô nên vẫn
# đối chiếu được số hiệu với bản sách. Đặt số hiệu trong directive thì agent
# thấy và có xu hướng chép vào tài liệu bàn giao — đã quan sát được BABOK lọt
# vào prd.md 5 lần ngay khi cấu hình còn chưa có số hiệu nào.
#
# Quy ước comment:  BABOK <sections>: <điều tài liệu nói> | thực hành: <diễn giải của repo>

